<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE4">
<meta name="robots" content="noindex, nofollow">
<title>לוח בקרה | CHECK</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  .wrap{ max-width:1120px; margin:0 auto; padding:22px 16px 60px; }
  #gate{ max-width:420px; margin:12vh auto 0; text-align:center; }
  #gate .panel-body{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:34px 26px; }
  #gate h1{ margin:0; font-size:24px; font-weight:900; }
  #gate p{ margin:0; color:var(--muted); font-size:14px; line-height:1.7; }
  #gate #gate-err{ color:var(--bad); font-weight:700; font-size:13px; display:none; }

  #app{ display:none; }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .top .who{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }

  .kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:22px; }
  @media(min-width:760px){ .kpis{ grid-template-columns:repeat(5,1fr); } }
  .kpi{ padding:16px 14px; }
  .kpi .l{ font-size:12px; font-weight:800; color:var(--muted); }
  .kpi .n{ font-family:'Rubik',sans-serif; font-size:clamp(22px,3.4vw,28px); font-weight:900; margin-top:4px; white-space:nowrap; }
  .kpi.hl{ background:var(--acid); }
  .kpi.hl .l{ color:var(--ink-2); }

  .charts{ display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; }
  @media(min-width:860px){ .charts{ grid-template-columns:1fr 1.4fr; } }
  .chart-card .panel-head h3{ margin:0; font-size:15px; font-weight:800; }
  .chart-box{ position:relative; height:250px; }

  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  #search{ flex:1 1 220px; }
  .seg{ display:flex; border:var(--line); border-radius:12px; overflow:hidden; background:#fff; }
  .seg button{ border:0; border-left:2px solid var(--ink); background:transparent; font:700 13px 'Heebo',sans-serif; padding:10px 14px; cursor:pointer; color:var(--ink); }
  .seg button:last-child{ border-left:0; }
  .seg button.on{ background:var(--ink); color:var(--acid); }
  .danger{ color:var(--bad); margin-inline-start:auto; }

  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:900px; }
  th,td{ padding:12px 14px; text-align:right; font-size:13.5px; white-space:nowrap; border-bottom:1.5px solid var(--paper-2); }
  thead th{ font-size:11.5px; font-weight:800; color:var(--muted); background:var(--paper); border-bottom:var(--line); }
  tbody tr:hover{ background:#FFF8E8; }
  td.name{ font-weight:800; white-space:normal; }
  .pill{ display:inline-block; padding:3px 11px; border-radius:999px; font-size:11.5px; font-weight:800; border:1.5px solid var(--ink); }
  .pill.signed{ background:var(--acid); }
  .pill.pending{ background:#FFE1D4; }
  .sub{ font-size:11px; color:var(--muted); margin-top:3px; }
  .acts{ display:flex; gap:6px; flex-wrap:wrap; }
  .rowbtn{ border:1.5px solid var(--ink); background:#fff; border-radius:9px; padding:5px 10px; font:700 12px 'Heebo',sans-serif; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; gap:5px; }
  .rowbtn svg{ width:14px; height:14px; }
  .rowbtn:hover{ background:var(--acid); }
  .rowbtn.del{ color:var(--bad); border-color:var(--bad); }
  .rowbtn.del:hover{ background:#FFE1D4; }
  .rowbtn:disabled{ opacity:.5; pointer-events:none; }
  .loading{ text-align:center; padding:34px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <div id="gate" class="panel">
    <div class="panel-body">
      <a class="wordmark" href="index.html"><span class="mark"><i data-i="mark"></i></span><span class="name brand-name">CHECK<i>.</i></span></a>
      <span class="tag ink">לוח בקרה</span>
      <p>התחברות עם חשבון הגוגל המורשה כדי לראות את כל ההצעות שנשלחו ואת סטטוס החתימה שלהן.</p>
      <button class="btn btn-hot" id="signInBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C39.9 37.1 44 31.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        התחברות עם Google
      </button>
      <p id="gate-err"></p>
    </div>
  </div>

  <div id="app">
    <header class="top">
      <a class="wordmark" href="index.html"><span class="mark"><i data-i="mark"></i></span><span class="name brand-name">CHECK<i>.</i></span></a>
      <div class="who">
        <span id="userEmail"></span>
        <a class="btn btn-sm btn-hot" href="index.html"><i data-i="link"></i> הצעה חדשה</a>
        <button class="btn btn-sm" id="refreshBtn"><i data-i="refresh"></i> רענן</button>
        <button class="btn btn-sm" id="signOutBtn"><i data-i="logout"></i> התנתק</button>
      </div>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="charts">
      <div class="panel chart-card"><div class="panel-head"><h3>סטטוס הצעות</h3></div><div class="panel-body"><div class="chart-box"><canvas id="statusChart"></canvas></div></div></div>
      <div class="panel chart-card"><div class="panel-head"><h3>הכנסות לפי חודש האירוע (חתומות)</h3></div><div class="panel-body"><div class="chart-box"><canvas id="revenueChart"></canvas></div></div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="search" class="field" placeholder="חיפוש לפי לקוח / סוג אירוע / הרכב…">
      <div class="seg" id="statusSeg">
        <button type="button" data-v="all" class="on">הכל</button>
        <button type="button" data-v="pending">ממתינות</button>
        <button type="button" data-v="signed">נחתמו</button>
      </div>
      <button type="button" class="btn btn-sm danger" id="deleteAllBtn"><i data-i="trash"></i> מחיקת כל ההיסטוריה</button>
    </div>

    <div class="panel tbl-wrap">
      <table>
        <thead>
          <tr><th>נשלח</th><th>לקוח</th><th>אירוע</th><th>הרכב</th><th>תאריך אירוע</th><th>מחיר</th><th>סטטוס</th><th>קובץ</th><th>פעולות</th></tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="9" class="loading">טוען נתונים…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<input type="file" id="fileUploadInput" accept="application/pdf" style="display:none">

<script src="config.js"></script>
<script src="icons.js"></script>
<script src="pricing.js"></script>
<script type="module">
  const cfg = window.CHECK_CONFIG || {};
  const BIZ = Object.assign({ name: 'CHECK' }, cfg.business || {});
  const PR = window.CHECK_PRICING;
  const COLLECTION = 'check_quotes';
  const APP  = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  const AUTH = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  const FS   = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  document.querySelectorAll('.brand-name').forEach(el => el.innerHTML = esc(BIZ.name) + '<i>.</i>');
  document.title = `לוח בקרה | ${BIZ.name}`;
  CheckIcons.paint();

  let db, fs, quotesCol, QUOTES = [], statusChart, revenueChart, unsub = null;
  let statusFilter = 'all', searchTerm = '';

  if (!cfg.firebase || !cfg.firebase.apiKey){
    showGateError('Firebase עדיין לא הוגדר — יש להדביק את פרטי הפרויקט בקובץ config.js (ההוראות ב-README).');
  } else {
    initFirebase().catch(err => { console.error(err); showGateError('טעינת Firebase נכשלה. רעננו את הדף ונסו שוב.'); });
  }

  async function initFirebase(){
    const [{ initializeApp }, authMod, fsMod] = await Promise.all([ import(APP), import(AUTH), import(FS) ]);
    const app = initializeApp(cfg.firebase);
    fs = fsMod;
    const auth = authMod.getAuth(app);
    db = fsMod.getFirestore(app);
    quotesCol = fsMod.collection(db, COLLECTION);
    try { await authMod.setPersistence(auth, authMod.browserLocalPersistence); } catch(e){}

    document.getElementById('signInBtn').addEventListener('click', async () => {
      try { await authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider()); }
      catch(e){ showGateError('ההתחברות נכשלה: ' + (e.code || e.message)); }
    });
    document.getElementById('signOutBtn').addEventListener('click', () => authMod.signOut(auth));

    authMod.onAuthStateChanged(auth, user => {
      if (!user){ if (unsub){ unsub(); unsub = null; } return showGate(); }
      if (cfg.adminEmail && (user.email || '').toLowerCase() !== cfg.adminEmail.toLowerCase()){
        authMod.signOut(auth);
        return showGateError('החשבון ' + user.email + ' אינו מורשה לצפות בלוח הבקרה.');
      }
      showApp(user);
      startLiveData();
    });
  }

  function showGate(){ document.getElementById('gate').classList.remove('hidden'); document.getElementById('app').style.display = 'none'; }
  function showGateError(msg){ showGate(); const e = document.getElementById('gate-err'); e.textContent = msg; e.style.display = 'block'; }
  function showApp(user){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
  }

  function startLiveData(){
    if (unsub) unsub();
    unsub = fs.onSnapshot(fs.query(quotesCol, fs.orderBy('createdAt', 'desc')), snap => {
      QUOTES = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderKpis(); renderCharts(); renderTable();
    }, err => {
      console.error(err);
      document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="loading">שגיאת הרשאות — בדקו את כללי Firestore (הקובץ firestore.rules)</td></tr>';
    });
  }

  document.getElementById('refreshBtn').addEventListener('click', () => location.reload());
  document.getElementById('search').addEventListener('input', e => { searchTerm = e.target.value.trim().toLowerCase(); renderTable(); });
  document.getElementById('statusSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    statusFilter = b.dataset.v;
    document.querySelectorAll('#statusSeg button').forEach(x => x.classList.toggle('on', x === b));
    renderTable();
  });

  // מחיקת הצעה (הקובץ החתום שמור בתוך אותו מסמך ונמחק איתו)
  async function deleteQuote(id){
    try { await fs.deleteDoc(fs.doc(db, COLLECTION, id)); return true; }
    catch(err){ console.error(err); alert('המחיקה נכשלה: ' + (err.message || err)); return false; }
  }

  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    if (!QUOTES.length){ alert('אין מה למחוק — הרשימה ריקה.'); return; }
    const typed = prompt(`פעולה זו תמחק לצמיתות את כל ${QUOTES.length} ההצעות, כולל הקבצים החתומים. אי אפשר לבטל.\n\nלאישור הקלידו בדיוק: מחק`);
    if (typed === null) return;
    if (typed.trim() !== 'מחק'){ alert('הטקסט לא תאם את המילה "מחק" — הפעולה בוטלה.'); return; }
    const btn = document.getElementById('deleteAllBtn'), list = QUOTES.slice();
    btn.disabled = true;
    for (let i = 0; i < list.length; i++){ btn.textContent = `מוחק… (${i + 1}/${list.length})`; await deleteQuote(list[i].id); }
    btn.disabled = false;
    btn.innerHTML = CheckIcons.svg('trash') + ' מחיקת כל ההיסטוריה';
  });

  /* ---- עזרי תצוגה ---- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])); }
  function money(n){ return '₪' + (Number(n) || 0).toLocaleString(); }
  function serviceLabel(k){ const s = PR.SERVICES[k] || PR.SERVICES[PR.DEFAULT_SERVICE]; return s ? s.label : ''; }
  function eventMonthKey(dateStr){
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(dateStr || '').trim());
    return m ? { key: `${m[3]}-${m[2]}`, label: `${m[2]}/${m[3]}` } : null;
  }
  function b64UrlEncode(str){
    const bytes = new TextEncoder().encode(str);
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // בונה מחדש את קישור הלקוח מתוך הרשומה — זהה לסדר השדות ב-index.html
  function buildShareUrl(q){
    const c = s => String(s == null ? '' : s).replace(/\|/g, '/');
    const raw = [c(q.clientName), c(q.eventType), c(q.location), c(q.date), c(q.startTime), c(q.endTime),
      q.guests || '', q.price || 0, q.deposit || 0, c(q.notes), q.id, q.service || PR.DEFAULT_SERVICE].join('|');
    const base = location.origin + location.pathname.replace(/dashboard\.html$/, '');
    return base + '?q=' + b64UrlEncode(raw);
  }
  function copyText(t, btn){
    const old = btn.innerHTML;
    const done = () => { btn.textContent = 'הועתק ✓'; setTimeout(() => btn.innerHTML = old, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(() => prompt('העתיקו את הקישור:', t));
    else prompt('העתיקו את הקישור:', t);
  }
  const fmtTs = ts => ts && ts.toDate ? ts.toDate().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }) : null;

  function renderKpis(){
    const total = QUOTES.length;
    const signedList = QUOTES.filter(q => q.status === 'signed');
    const signed = signedList.length, pending = total - signed;
    const revenue = signedList.reduce((s, q) => s + (Number(q.price) || 0), 0);
    const rate = total ? Math.round((signed / total) * 100) : 0;
    const kpi = (n, l, hl) => `<div class="panel kpi${hl ? ' hl' : ''}"><div class="l">${l}</div><div class="n">${n}</div></div>`;
    document.getElementById('kpis').innerHTML =
      kpi(total, 'הצעות שנשלחו') + kpi(signed, 'נחתמו') + kpi(pending, 'ממתינות לחתימה') +
      kpi(rate + '%', 'אחוז סגירה') + kpi(money(revenue), 'הכנסה מחתומות', true);
  }

  function renderCharts(){
    const font = { family: 'Heebo', weight: 700 };
    const signed = QUOTES.filter(q => q.status === 'signed').length, pending = QUOTES.length - signed;
    if (statusChart) statusChart.destroy();
    statusChart = new Chart(document.getElementById('statusChart'), {
      type: 'doughnut',
      data: { labels: ['נחתמו', 'ממתינות'], datasets: [{ data: [signed, pending], backgroundColor: ['#C8F230', '#FF4F1A'], borderColor: '#16120E', borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: { legend: { position: 'bottom', labels: { color: '#16120E', font, usePointStyle: true } } } }
    });

    const byMonth = {};
    QUOTES.filter(q => q.status === 'signed').forEach(q => {
      const m = eventMonthKey(q.date); if (!m) return;
      byMonth[m.key] = byMonth[m.key] || { label: m.label, total: 0 };
      byMonth[m.key].total += Number(q.price) || 0;
    });
    const keys = Object.keys(byMonth).sort();
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(document.getElementById('revenueChart'), {
      type: 'bar',
      data: { labels: keys.map(k => byMonth[k].label),
        datasets: [{ data: keys.map(k => byMonth[k].total), backgroundColor: '#FF4F1A', borderColor: '#16120E', borderWidth: 2, borderRadius: 6, maxBarThickness: 40 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => money(c.parsed.y) } } },
        scales: { x: { ticks: { color: '#3A332B', font }, grid: { display: false } },
                  y: { ticks: { color: '#3A332B', font, callback: v => '₪' + Number(v).toLocaleString() }, grid: { color: 'rgba(22,18,14,.08)' } } } }
    });
  }

  function renderTable(){
    let rows = QUOTES.slice();
    if (statusFilter !== 'all') rows = rows.filter(q => (q.status || 'pending') === statusFilter);
    if (searchTerm) rows = rows.filter(q => `${q.clientName || ''} ${q.eventType || ''} ${serviceLabel(q.service)}`.toLowerCase().includes(searchTerm));
    const tbody = document.getElementById('tbody');
    if (!rows.length){ tbody.innerHTML = '<tr><td colspan="9" class="loading">אין הצעות להצגה</td></tr>'; return; }

    tbody.innerHTML = rows.map(q => {
      const signed = q.status === 'signed', signedAt = fmtTs(q.signedAt);
      const pill = signed ? `<span class="pill signed">נחתם</span>${signedAt ? `<div class="sub">${signedAt}</div>` : ''}` : '<span class="pill pending">ממתין</span>';
      const file = q.pdfData
        ? `<div class="acts"><button type="button" class="rowbtn view-file" data-id="${q.id}">${CheckIcons.svg('eye')} צפייה</button><button type="button" class="rowbtn upload-file" data-id="${q.id}">${CheckIcons.svg('refresh')} החלף</button></div>`
        : `<button type="button" class="rowbtn upload-file" data-id="${q.id}">${CheckIcons.svg('upload')} העלאה</button>`;
      return `<tr>
        <td>${fmtTs(q.createdAt) || '—'}</td>
        <td class="name">${esc(q.clientName)}</td>
        <td>${esc(q.eventType)}</td>
        <td>${esc(serviceLabel(q.service))}</td>
        <td dir="ltr" style="text-align:right">${esc(q.date)}</td>
        <td><b>${money(q.price)}</b></td>
        <td>${pill}</td>
        <td>${file}</td>
        <td><div class="acts">
          <button type="button" class="rowbtn copy-link" data-id="${q.id}">${CheckIcons.svg('copy')} העתק קישור</button>
          <button type="button" class="rowbtn del delete-row" data-id="${q.id}">${CheckIcons.svg('trash')} מחק</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  // מאזין אחד לכל כפתורי הטבלה
  document.getElementById('tbody').addEventListener('click', async e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const q = QUOTES.find(x => x.id === btn.dataset.id); if (!q) return;
    if (btn.classList.contains('copy-link')) copyText(buildShareUrl(q), btn);
    else if (btn.classList.contains('delete-row')){
      if (!confirm(`למחוק לצמיתות את ההצעה של ${q.clientName || 'הלקוח'}? לא ניתן לשחזר.`)) return;
      btn.disabled = true; btn.textContent = 'מוחק…';
      if (!(await deleteQuote(q.id))) { btn.disabled = false; btn.textContent = 'מחק'; }
    }
    else if (btn.classList.contains('view-file')){
      try {
        const bin = atob(q.pdfData), arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
        window.open(url, '_blank');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch(err){ console.error(err); alert('פתיחת הקובץ נכשלה.'); }
    }
    else if (btn.classList.contains('upload-file')){
      pendingUploadId = q.id;
      document.getElementById('fileUploadInput').click();
    }
  });

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => { const r = reader.result || ''; const i = r.indexOf(','); resolve(i >= 0 ? r.slice(i + 1) : r); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // העלאה / החלפה ידנית של PDF לשורה — כשהשמירה האוטומטית בזמן החתימה לא הצליחה
  let pendingUploadId = null;
  document.getElementById('fileUploadInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    const id = pendingUploadId; pendingUploadId = null;
    if (!file || !id) return;
    if (file.type !== 'application/pdf'){ alert('אפשר להעלות רק קובץ PDF.'); return; }
    if (file.size > 700 * 1024){ alert('הקובץ גדול מדי (עד כ-700KB).'); return; }
    const btn = document.querySelector(`.upload-file[data-id="${id}"]`);
    if (btn){ btn.disabled = true; btn.textContent = 'מעלה…'; }
    try { await fs.updateDoc(fs.doc(db, COLLECTION, id), { pdfData: await blobToBase64(file) }); }
    catch(err){ console.error(err); alert('ההעלאה נכשלה: ' + (err.message || err)); if (btn){ btn.disabled = false; btn.textContent = 'העלאה'; } }
  });
</script>
</body>
</html>
